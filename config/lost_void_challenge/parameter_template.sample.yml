# 该文件用于演示所有可用参数, 请以此为蓝本裁剪自己专属的空洞配置
# 更详尽的参数请参考
# assets\game_data\hollow_zero\lost_void\lost_void_artifact_data.yml

# 自动战斗配置, 建议不要改动, 直接用通配, 有问题上报.
auto_battle: 全配队通用

# 区域类型优先级, 优先级从上到下, 相同的区域类型会按照优先级顺序进行选择
# 当前按性价比进行了排序, 建议全自动少选择突发事件或降低优先级
region_type_priority:
  - 战斗-武备
  - 挑战-无伤
  - 邦布商店
  - 挚交会谈
  - 战斗-道中危机
  - 战斗-终结之役
  - 战斗-硬币
  - 挑战-限时
  - 战斗-鸣徽

# 藏品优先级, 可以设置多个, 优先级从上到下, 相同的藏品会按照优先级顺序进行购买
# 这里仅做组合示例
# 建议不要设置太多, 否则会导致武备刷取缓慢
artifact_priority:
  - 机敏
  - 终结
  - 通用
  - 绝境
  - 契合
  - 异常·击破
  - 星见雅
  - 星见雅 花间雀
  - 艾莲
  - 月城柳
  - 比利
  - 卡牌
  - 绝境 战斗维生包
  - 无详情 获得鸣徽

# 藏品第二优先级
artifact_priority_2:
  - 异常·击破 混沌量杯
  - 通用 三相战斗陀螺
  - 绝境

# 只购买高优先级
# 到达第 x 轮（已刷新 x-1 次）后 才购买高优先级之外的藏品; 值越大 越晚放开
buy_only_priority_2: 3

# 周期增益
# 可选参数: 第一个, 第二个, 第三个
period_buff_no: 第一个

# 调查策略
# 选择使用的调查战略名称, 对应内部加载的战略列表条目, 影响进入副本时的战略选择逻辑
investigation_strategy: 攻其不备战略

# 追新模式
# 开启后优先选择未满级的调查战略
chase_new_mode: true

# 优先选择NEW！藏品
# 开启后在藏品筛选时对未记录过的新藏品给予额外考虑
artifact_priority_new: true

# 商店-使用血量购买
# 关闭后不允许在邦布商店用当前角色血量作为货币购买
store_blood: false
# 以下几项界面上没有开关, 只能在 yml 里设置, 默认都关闭; 「无脑挂机刷菲林」预设全部打开
# 详见 docs/develop/zzz/application/lost_void/afk_polychrome.md

# 新的寻路脱困: 画面静止判卡住, 后退/横移/前进绕开障碍
smart_escape: false

# 同派系抱团: 本局已有通用武备派系的鸣徽和武备最先选, 选鸣徽时没有同派系的就刷新
same_faction_first: false

# 商店留硬币: 普通商店最多刷新 3 次, 之后只买同派系鸣徽, 硬币留给第三层终结之役前的最后一个休息区
# 开启后 buy_only_priority_2 不生效
store_save_coin: false

# 按 Tab 地图规划本层路线, 寻路锁定规划的入口
route_plan_by_map: false

# 进入副本前切换难度 如 难度五; 留空沿用游戏当前难度; 目前只支持战线肃清
difficulty: ''

# 追新模式找不到可刷的调查战略时 结束本次运行; 关闭时点第一个战略继续刷
stop_when_no_strategy: false
