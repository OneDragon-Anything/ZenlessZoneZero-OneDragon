# 克拉蕾-铭刻循环
# 用途：猩红铭刻内的唯一主循环 = 「长按 E 泄残痕」+「普攻垫残痕」交替。
#
# 为什么用长按 E：
#   * 点按 E = [特殊技:血华誓·斩金断铁] → 固定只消耗 **1 层**残痕，1 次毁伤；
#   * 长按 E = [特殊技:血华誓·葬血强袭] → 连续 3 次横斩，**有几层爆几层**（1~3 层 → 最多 3 次毁伤）。
#   官方原文是「每次横向斩击命中持有[残痕]的敌人时，对目标触发[毁伤]」，
#   所以只有 0~2 层时长按也不亏 —— 它只是「能爆多少爆多少」，
#   层数少时毁伤次数与点按一样，而横斩本身还在出伤害。
#   ⇒ 长按是点按的**超集**，铭刻内不需要「点按爆 1 层 / 长按爆 3 层」两套逻辑。
#
# 为什么这样配能压住残痕：
#   * 铭刻内普攻有 +50% 残痕积蓄效率，叠层比单体泄层快；点按 E 一轮只泄 1 层
#     ⇒ 残痕会卡在 3 层上限，之后打出去的普攻都在白叠。
#   * 每轮长按 E 单次泄 1~3 层，泄压速度才跟得上叠加速度 —— 循环一遍即清零。
#   * 铭刻内点按 / 长按 E **都不消耗锐能**（锐能只在进铭刻那一次扣 60），
#     所以这里不需要任何限流器，E 每轮都按。
#
# ⚠️ 这里**故意不设** `自定义-无视闪光` / `自定义-动作不打断`：
#   这两个状态都是「闪避屏蔽开关」——闪避场景的守卫写作
#     ![自定义-无视闪光, -15, 0]  /  ![自定义-动作不打断, -10, -0.1]
#   本模板是每 3 秒左右跑一次的主循环，若在这里设就等于**永久屏蔽闪避**（红光/黄光都不闪），
#   挨打倒地才是「循环间停顿」的真凶。只有带真无敌帧的一次性长动作（终结技等）才该设。
#
# 校准点：
#   * 长按 E：按下 → 每 0.5s 重复按下 → 松开（SKILL.md 的长按惯例，与下面长按普攻段同节奏），
#     保持时长 ≈ 1.1s，需要盖过葬血强袭的判定门槛；不够就再加一段「按下/等待」。
#   * 普攻两段 0.25s、长按普攻三段 0.5s×2（对应血斧三段的第三段连斩）。
operations:
  # ---- 长按强化特殊技：葬血强袭，连续 3 次横斩，有几层残痕爆几层 ----
  - op_name: "按键-特殊攻击-松开"
  - op_name: "等待秒数"
    seconds: 0.1
  - op_name: "按键-特殊攻击-按下"
  - op_name: "等待秒数"
    seconds: 0.5
  - op_name: "按键-特殊攻击-按下"
  - op_name: "等待秒数"
    seconds: 0.5
  - op_name: "按键-特殊攻击-松开"
  # ---- 引爆之后接普攻：把残痕重新垫起来（也是本循环里主要出伤害的部分）----
  - op_name: "按键-普通攻击"
    post_delay: 0.25
    repeat: 2
  # 长按普攻：延长第三段连斩
  - op_name: "按键-普通攻击-松开"
  - op_name: "等待秒数"
    seconds: 0.1
  - op_name: "按键-普通攻击-按下"
  - op_name: "等待秒数"
    seconds: 0.5
  - op_name: "按键-普通攻击-按下"
  - op_name: "等待秒数"
    seconds: 0.5
  - op_name: "按键-普通攻击-松开"
