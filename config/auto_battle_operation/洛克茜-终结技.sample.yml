# 洛克茜-终结技
# 用途：[终结技:葬夜安魂曲]，对前方大范围敌人发动多道龙卷风打击。
# 关键机制：终结技发动后**获得 1 点[风能]** —— 所以失衡期先放终结技再长按 E，
#           等于白捡 1 点风能（长按 E 时能量还够 25 点就能再换 1 点）。
# 策略：尽量打进失衡期（伤害窗口），「速切模板-洛克茜」里只在失衡分支放它。
# 校准点：按键重复次数与收招等待。
operations:
  - op_name: "设置状态"
    state: "自定义-失衡时间"
    seconds_add: -2
  - op_name: "设置状态"
    state: "自定义-动作不打断"
    seconds: 5
  - op_name: "按键-终结技"
    post_delay: 0.1
    repeat: 20
  - op_name: "等待秒数"
    seconds: 1
