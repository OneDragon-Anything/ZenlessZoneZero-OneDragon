# 克拉蕾-普攻连段
# 用途：不在[猩红铭刻]时用普攻攒锐能。锐能是克拉蕾自己的能量条，每秒自动回复、入场回 60 点，
#       攒满 60 点即可点按强化特殊技变身（见「克拉蕾-进入猩红铭刻」）。
# 说明：普攻同时也在给敌人叠残痕值（残痕满后施加[残痕]，最多 3 层）。
# ⚠️ 这是兜底主循环（每 2 秒跑一次），**不设** 自定义-动作不打断 / 自定义-无视闪光，
#    否则会永久屏蔽闪避（原因见「克拉蕾-强化连段」的注释）。
# 校准点：普攻段数与 post_delay，需按实际动画时长调。
operations:
  - op_name: "按键-普通攻击"
    repeat: 8
    post_delay: 0.25
