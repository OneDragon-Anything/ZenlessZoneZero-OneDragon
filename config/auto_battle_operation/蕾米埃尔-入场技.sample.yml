# 入场技：演出动画4秒期间游戏计时冻结，需按动画时长补回失衡时间；动画后持续2秒
operations:
  - op_name: "设置状态"
    state_list: ["自定义-动作不打断", "自定义-无视闪光"]
    seconds: 10
  - op_name: "设置状态"
    state: "自定义-失衡时间"
    seconds_add: -4
  # 按键-切换角色 不支持 repeat 需要按次写 按 等 按 等 按
  - op_name: "按键-切换角色"
    agent_name: "蕾米埃尔"
    post_delay: 0.5
  - op_name: "按键-切换角色"
    agent_name: "蕾米埃尔"
    post_delay: 0.5
  - op_name: "按键-切换角色"
    agent_name: "蕾米埃尔"
  - op_name: "等待秒数"
    seconds: 3
  - op_name: "等待秒数"
    seconds: 2
