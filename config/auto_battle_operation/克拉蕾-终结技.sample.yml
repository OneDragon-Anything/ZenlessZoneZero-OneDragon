# 克拉蕾-终结技
# 用途：[终结技:血华誓·千锤百炼]，对前方目标连续斩击，造成大量电属性伤害。
# 关键机制：终结技动画期间[猩红铭刻]的持续时间不再减少、也不会退出该状态 ——
#           所以放 Q 不占用铭刻时间，这里也不需要动铭刻计时器。
# 策略：「速切模板-克拉蕾」在铭刻期间只要 Q 就绪就放，等于白嫖一段长动画的伤害窗口。
# 校准点：按键重复次数与收招等待。
operations:
  - op_name: "设置状态"
    state: "自定义-失衡时间"
    seconds_add: -2
  - op_name: "设置状态"
    state: "自定义-动作不打断"
    seconds: 5
  - op_name: "按键-终结技"
    post_delay: 0.1
    repeat: 20
  - op_name: "等待秒数"
    seconds: 1
