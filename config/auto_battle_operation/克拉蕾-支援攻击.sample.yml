# 克拉蕾-支援攻击
# 用途：锋御职业专属的[反制支援:寸铁不让]。敌人打控制技时（黄光）发动，代理人与敌人进入角力，
#       角力成功后化解对方的控制技；攻略实测「不停长按普攻就能角力成功」，且成功后会白嫖 1 层残痕。
# 所以这里不做格挡 / 闪A，而是持续长按普攻。
# 校准点：角力需要多长的长按（这里 1.5s 估）。动作不打断对齐官方的 通用-支援攻击（2s）。
operations:
  - op_name: "设置状态"
    state: "自定义-动作不打断"
    seconds: 2
  - op_name: "按键-普通攻击-松开"
  - op_name: "等待秒数"
    seconds: 0.1
  - op_name: "按键-普通攻击-按下"
  - op_name: "等待秒数"
    seconds: 0.5
  - op_name: "按键-普通攻击-按下"
  - op_name: "等待秒数"
    seconds: 0.5
  - op_name: "按键-普通攻击-按下"
  - op_name: "等待秒数"
    seconds: 0.5
  - op_name: "按键-普通攻击-松开"
