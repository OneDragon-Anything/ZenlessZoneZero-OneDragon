# 克拉蕾-强化连段
# 用途：猩红铭刻中的主力循环，对应官方手法「点按强化特殊技 → 普攻三段 → 再点按强化特殊技」。
#   1) 点按强化特殊技：命中带[残痕]的敌人时消耗 1 层、触发[毁伤]（范围电属性伤害），并派生旋转跳斩；
#   2) 接普攻三段：猩红铭刻下的普攻是血斧三段，第三段是连续突刺斩击 + 跳起下砸；
#      长按普攻可以延长第三段连斩时间（所以这里用「松开 → 按下 → 每 0.5s 补按下 → 松开」的长按写法）。
#
# ⚠️ 这里**故意不设** `自定义-无视闪光` / `自定义-动作不打断`：
#   两个状态都是「闪避屏蔽开关」——dodge 场景的守卫写作
#     ![自定义-无视闪光, -15, 0]  /  ![自定义-动作不打断, -10, -0.1]
#   本模板是每 3 秒跑一次的主循环，若在这里设 4 秒，等于**永久屏蔽闪避**（红光/黄光都不闪），
#   挨打倒地就是「循环间停顿」的真凶。官方站场 C（般岳/11号/朱鸢/可琳）的站场循环同样不设这两个状态。
#   只有带真无敌帧的**一次性长动作**（终结技等）才该设。
# 校准点：E 的 post_delay 0.9s、普攻两段的节奏 0.25s、长按时长 1.5s。
operations:
  # 点按强化特殊技：引爆 1 层残痕，打出毁伤 + 旋转跳斩
  - op_name: "按键-特殊攻击"
    post_delay: 0.9
  # 普攻前两段
  - op_name: "按键-普通攻击"
    post_delay: 0.25
    repeat: 2
  # 长按普攻：延长第三段连斩
  - op_name: "按键-普通攻击-松开"
  - op_name: "等待秒数"
    seconds: 0.1
  - op_name: "按键-普通攻击-按下"
  - op_name: "等待秒数"
    seconds: 0.5
  - op_name: "按键-普通攻击-按下"
  - op_name: "等待秒数"
    seconds: 0.5
  - op_name: "按键-普通攻击-按下"
  - op_name: "等待秒数"
    seconds: 0.5
  - op_name: "按键-普通攻击-松开"
