# 克拉蕾-终爆
# 用途：长按强化特殊技，一次引爆全部[残痕]（最多 3 层）打爆发。留给失衡期用（敌人动不了，层数攒得最稳）。
# 说明：残痕层数读不到（在敌人身上），所以靠「长按 = 全爆」这个动作本身兜底；
#       用 自定义-克拉蕾-终爆冷却 打点限流，读的时候用 [.., 0, 8]，避免冷却期间反复长按把 E 卡住。
# ⚠️ 不设 自定义-无视闪光 / 自定义-动作不打断 —— 这个模板跑在失衡窗口里，
#    而且它跟主循环交替出现，设了会把闪避屏蔽掉（原因见「克拉蕾-强化连段」的注释）。
# 校准点：长按需要多久才判定为「长按」（这里按 1.0s 估，不够就再加一段按下）。
operations:
  - op_name: "按键-特殊攻击-松开"
  - op_name: "等待秒数"
    seconds: 0.1
  - op_name: "按键-特殊攻击-按下"
  - op_name: "等待秒数"
    seconds: 0.5
  - op_name: "按键-特殊攻击-按下"
  - op_name: "等待秒数"
    seconds: 0.5
  - op_name: "按键-特殊攻击-松开"
  - op_name: "设置状态"
    state: "自定义-克拉蕾-终爆冷却"
  - op_name: "等待秒数"
    seconds: 0.8
