# 洛克茜-普攻连段
# 用途：攒能量用。洛克茜的能量条就是常规能量条（上限 120），每消耗 25 点能量换 1 点[风能]（上限 3 点），
#       所以她的输出循环完全由能量驱动 —— 能量空了长按强化特殊技也攒不到风能。
#       普攻[烦请留步]共 4 段，打满 4 段回能比只打 1 段多。
# ⚠️ 这是兜底主循环（每 2 秒跑一次），**不设** 自定义-动作不打断 / 自定义-无视闪光，
#    否则会永久屏蔽闪避（原因见「洛克茜-强化特殊技-攒满」的注释）。
# 校准点：普攻段数与 post_delay，需按实际动画时长调。
operations:
  - op_name: "按键-普通攻击"
    repeat: 8
    post_delay: 0.25
