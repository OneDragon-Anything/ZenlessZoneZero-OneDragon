# 克拉蕾-闪避反击
# 用途：红光 / 音效识别闪避时使用 —— 先闪避，再立刻接普攻三段反击。
#
# 为什么必须有「闪避」这一下：
#   [闪避识别-红光] 场景只负责把 [自定义-红光闪避] 这个信号状态打上（见「闪A模板-全角色」），
#   它本身不发任何按键；真正的闪避输入由本模板发出。
#   绝区零的闪避反击也是两步机制：先闪避进入极限闪避，再按普攻才判定成反击。
#
# 为什么用不带方向的闪避（直接按闪避键）：
#   反打的目的就是「就地躲开 + 立刻还手」，不位移才不会在闪完之后脱离攻击范围；
#   克拉蕾的普攻自带索敌前冲，闪完能自己贴上去。
#
# ⚠️ 不设 自定义-动作不打断 —— 本动作全长约 0.9s，而闪避场景的守卫是
#    ![自定义-动作不打断, -10, -0.1]，在这里设它会把紧接着的下一次红光 / 音效闪避也屏蔽掉。
#
# 校准点：闪避 post_delay 0.2s（留足极限闪避判定窗口）与普攻段数。
operations:
  - op_name: "按键-闪避"
    post_delay: 0.2
  - op_name: "按键-普通攻击"
    post_delay: 0.25
    repeat: 3
