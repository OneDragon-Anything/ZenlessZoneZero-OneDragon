# 克拉蕾-连携攻击
# 用途：[连携技:血华誓·血契共鸣]。动画期间会延长[猩红铭刻] 2 秒。
# 注意：这里**不需要**手动给铭刻加 2 秒 —— [克拉蕾-猩红铭刻] 是直接读头像下方那条红条
#       识别出来的（agent_state 模板），延长后条会自己变长。
operations:
  - op_name: "设置状态"
    state: "自定义-失衡时间"
    seconds_add: -1
  - op_name: "设置状态"
    state: "自定义-动作不打断"
    seconds: 2
  - op_name: "等待秒数"
    seconds: 2
