# 终结技：动画持续2秒；每秒切换一次南宫羽，总持续约5秒
operations:
  - op_name: "设置状态"
    state: "自定义-失衡时间"
    seconds_add: -1
  - op_name: "设置状态"
    state: "自定义-动作不打断"
    seconds: 5
  - op_name: "按键-终结技"
    post_delay: 0.1
    repeat: 10
  - op_name: "等待秒数"
    seconds: 1
  - op_name: "按键-切换角色"
    agent_name: "南宫羽"
