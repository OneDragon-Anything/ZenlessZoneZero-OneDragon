# 洛克茜-连携攻击
# 用途：[连携技:葬风巨锤]，对前方敌人发动强力打击，造成大量风属性伤害。
# 说明：连携技不产生也不消耗[风能]，也不影响能量条，所以这里不需要额外维护任何计时器，
#       只对齐连携后摇并刷新失衡时间。
# 校准点：连携后摇时长（这里 2s 是估的）。
operations:
  - op_name: "设置状态"
    state: "自定义-失衡时间"
    seconds_add: -1
  - op_name: "设置状态"
    state: "自定义-动作不打断"
    seconds: 2
  - op_name: "等待秒数"
    seconds: 2
