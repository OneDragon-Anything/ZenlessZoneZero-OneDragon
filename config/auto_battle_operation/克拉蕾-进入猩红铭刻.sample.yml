# 克拉蕾-进入猩红铭刻
# 用途：锐能攒够 60（E 按钮亮）时点按强化特殊技 —— 把锻造锤变成血斧斩击一次，
#       附带进入[猩红铭刻]，持续 16 秒。
#       连携技 +2 秒、击杀 +3 秒、终结技期间不减少，这些都由头像下方那条红条自己反映
#       （[克拉蕾-猩红铭刻] 由 agent_state 模板识别），不需要在这里计时。
#
# 为什么这样写有效：
#   * 整个模板只做一件事 —— 按一下 E。锐能就在这一步扣掉 60 并进入铭刻；
#     之后铭刻内的点按 / 长按 E 都不消耗锐能 ⇒ 不需要任何冷却计时器去打点节流。
#   * 不设 `自定义-动作不打断`：本模板的调用周期 ≈ post_delay（约 1 秒），
#     而全配队通用的红光闪避守卫写作 `![自定义-动作不打断, -10, -0.1]`，
#     在这里设它等于把红光闪避永久屏蔽（黄光支援不受该状态影响），会出现挨打倒地。
#     只有带真无敌帧的一次性长动作（终结技等）才该设这个状态。
#     若实机发现 E 总被打断、进不去铭刻，可加回来并把 seconds 压到 ≤ 0.8。
#
# 校准点：post_delay 1.0s（E 的动画时长；进铭刻后马上就能接长按 E）。
operations:
  - op_name: "按键-特殊攻击"
    post_delay: 1.0
