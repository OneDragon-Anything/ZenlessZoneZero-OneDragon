# 克拉蕾-进入猩红铭刻
# 用途：锐能满 60 点时，点按强化特殊技进入[猩红铭刻]（血斧形态），持续 16 秒。
#       连携技延长 2 秒、击杀敌人延长 3 秒 —— 这些延长不用自己记，
#       头像下方那条红条的剩余时长会直接反映（[克拉蕾-猩红铭刻] 由 agent_state 模板识别）。
# 计时器约定：最后打两个点：
#   * 自定义-克拉蕾-变身冷却 —— 挡掉变身动画期间（条还没画出来）被状态机二次触发的问题；
#   * 自定义-克拉蕾-终爆冷却 —— 给「蓄痕兜底-长按E全爆」起表，
#     让第一次全爆发生在变身约 7 秒后（那时残痕才攒得起来），而不是一进铭刻就空爆。
# 校准点：变身动画时长（post_delay 1.2s 是估的）。
operations:
  - op_name: "设置状态"
    state: "自定义-动作不打断"
    seconds: 2
  - op_name: "按键-特殊攻击"
    post_delay: 1.2
  - op_name: "设置状态"
    state: "自定义-克拉蕾-变身冷却"
  - op_name: "设置状态"
    state: "自定义-克拉蕾-终爆冷却"
