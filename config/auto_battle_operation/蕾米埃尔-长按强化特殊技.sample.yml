operations:
  # 对齐官方长按规范：按下 → 每 0.5s 重复按下 → 松开；保护时长与实际按住时间匹配
  - op_name: "设置状态"
    state_list: ["自定义-动作不打断", "自定义-无视闪光"]
    seconds: 3.5
  - op_name: "按键-普通攻击-松开"
  - op_name: "等待秒数"
    seconds: 0.02
  - op_name: "按键-特殊攻击-按下"
  - op_name: "等待秒数"
    seconds: 0.5
  - op_name: "按键-特殊攻击-按下"
  - op_name: "等待秒数"
    seconds: 0.5
  - op_name: "按键-特殊攻击-按下"
  - op_name: "等待秒数"
    seconds: 0.5
  - op_name: "按键-特殊攻击-按下"
  - op_name: "等待秒数"
    seconds: 0.5
  - op_name: "按键-特殊攻击-按下"
  - op_name: "等待秒数"
    seconds: 0.5
  - op_name: "按键-特殊攻击-按下"
  - op_name: "等待秒数"
    seconds: 0.5
  - op_name: "按键-特殊攻击-松开"
  - op_name: "清除状态"
    state_list: ["自定义-动作不打断", "自定义-无视闪光"]
