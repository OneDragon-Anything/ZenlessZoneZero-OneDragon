# 特殊技连点 6 次（约 0.6 秒）打一段强化特殊技，随后普攻连点 19 次（约 1.9 秒）接 A3、A4。
# A4 是她的合轴点：A4 打完就能切人，所以模板末尾直接设「自定义-合轴时间」。
# 普通特殊技和强化特殊技都带格挡，所以红光格挡和有能量时的输出都用这一个模板，
# 区别只是能量够不够——由游戏自己决定放哪一段，脚本不判断。
operations:
  - op_name: "设置状态"
    state: "自定义-动作不打断"
    seconds: 1.5
  - op_name: "按键-特殊攻击"
    post_delay: 0.1
    repeat: 6
  - op_name: "按键-普通攻击"
    post_delay: 0.1
    repeat: 19
  - op_name: "设置状态"
    state: "自定义-合轴时间"
  - op_name: "清除状态"
    state: "自定义-动作不打断"
