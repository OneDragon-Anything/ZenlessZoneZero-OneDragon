# 洛克茜-支援攻击
# 用途：击破职业的支援动作。黄光时切洛克茜进来，用[支援突击:午夜守则]打一下。
#
# 三条支援相关技能的区别（Wiki 原文）：
#   [支援突击:午夜守则]     —— 切人后**点按**普攻发动。倍率 1112%，主目标。
#   [招架支援:为您分忧]     —— 敌人打控制技时的反制（黄光的另一种处理）
#   [支援技:还要加班？]     —— **发动[招架支援]后再次点按**才触发，倍率仅 39%
#                             （失衡 0），定位是「回避伤害的短动作」，收益极低。
#   所以这里只打第一段（支援突击），连点 8 次普攻里若游戏判定成了招架支援，
#   第二次点按会顺带把「还要加班？」也放出来 —— 无害且带无敌，不刻意规避。
#
# 为什么必须**点按**普攻而不是长按（2026-10-04 实机修正）：
#   洛克茜的[支援突击:午夜守则]是「切人后点按普攻」发动的，不是长按动作。
#   早先照抄克拉蕾的支援模板用了长按普攻 1.5s —— 克拉蕾要长按是因为她的
#   [反制支援:寸铁不让]是角力，必须持续按住才推进；支援突击完全相反。
#   长按普攻的后果是「跳过支援突击、直接进普通攻击连段」，倍率 1112% 一分拿不到，
#   只剩普攻 4 段累计 192.5%。
#
# 时长口径（对齐项目通用写法）：
#   `标准-支援攻击模板` 用点按普攻 x10 + 等待 0.5，`通用-支援攻击` 用 x15 + 等待 0.5，
#   两者的注释都写着「总用时刚好就是极限无敌时间」—— 也就是**点按要一直点到动作自然结束**，
#   点不够次数会停在突进半途（表现为「切进来了但没打出支援」）。
#   洛克茜参照 `般岳-支援突击-冲霄`（同为支援突击）：点按 x5 + 等待 1.0。
#   取 x8 是因为洛克茜的支援突击带一段突进，比般岳的近战支援突击多花时间。
#
# 校准点：点按次数（现在 8）与收招等待（现在 1.0s）。打不满支援突击就调次数。
# ⚠️ 不设 自定义-无视闪光 —— 支援突击不是长无敌动作，设了会把紧接着的闪避屏蔽掉。
operations:
  - op_name: "设置状态"
    state: "自定义-动作不打断"
    seconds: 2
  - op_name: "按键-普通攻击-松开"
  - op_name: "按键-普通攻击"
    post_delay: 0.1
    repeat: 8
  - op_name: "等待秒数"
    seconds: 1
