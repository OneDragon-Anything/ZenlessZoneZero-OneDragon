# 强化特殊技合轴：特殊技连点1秒后接普攻，再切换下一位
operations:
  - op_name: "设置状态"
    state: "自定义-动作不打断"
    seconds: 1.5
  - op_name: "按键-特殊攻击"
    post_delay: 0.1
    repeat: 8
  - op_name: "清除状态"
    state: "自定义-动作不打断"
  - op_name: "按键-普通攻击"
    post_delay: 0.1
    repeat: 5
  - op_name: "设置状态"
    state: "自定义-合轴时间"
