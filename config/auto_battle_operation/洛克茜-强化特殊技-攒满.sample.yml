# 洛克茜-强化特殊技-攒满
# 用途：[强化特殊技:小心风寒] 长按 E 攒满 3 点[风能] —— 洛克茜的核心输出轴。
#
# 时长依据（2026-10-04 实测录屏）：
#   t=2.3s  按下 E
#   t=5.2s  积攒满 3 点[风能]
#   => 按住时长 = 5.2 - 2.3 = 2.9s，约 1 秒 1 点。
#   （注意：2.3s 是视频时间轴上的「按下时刻」，不是起手动画时长。）
#
# 完整链路：长按 E -> [自旋]龙卷风（无敌 + 聚怪 + 攒风能）-> 松开 ->
#   自动衔接[敬请特殊技:敬请安息]风炮（消耗全部风能，每点风能多打一段、原地生成 1 个[风眼]）
#   -> 若场上+自身风眼 ≥3，游戏自动发动[特殊技:恕不远送]丢锤引爆（这部分不用脚本管）
#
# 能量校验：Wiki 写自旋每秒耗能 30，2.9s 耗 87 点；攒 3 点需 75 点（25/点）。
#   实测每点约耗 29 点，与「全程 30/秒」吻合 —— 说明**起手滑行阶段也在耗能**，
#   所以能量不足时游戏会提前把[自旋]断掉，攒不满 3 点。
#   ⇒ 进本模板前能量需 ≥ 85（见速切模板的 {85, 120} 门槛）。
#
# ⚠️ 这里**故意不设** `自定义-无视闪光` / `自定义-动作不打断`：
#   两个状态都是「闪避屏蔽开关」——dodge 场景的守卫写作
#     ![自定义-无视闪光, -15, 0]  /  ![自定义-动作不打断, -10, -0.1]
#   本模板是每 3 秒跑一次的主循环，若在这里设 4 秒，等于**永久屏蔽闪避**（红光/黄光都不闪），
#   挨打倒地就是「循环间停顿」的真凶。只有带真无敌帧的**一次性长动作**（终结技等）才该设。
#
# 校准点：末尾「等待秒数」是风炮 + 恕不远送的收招，需按录屏实测调整。
operations:
  # 先确保 E 没被别处按住（长按的起点）
  - op_name: "按键-特殊攻击-松开"
  - op_name: "等待秒数"
    seconds: 0.1
  # ---- 长按 2.9s 攒满 3 点风能（每 0.5s 补一次按下维持长按）----
  - op_name: "按键-特殊攻击-按下"
  - op_name: "等待秒数"
    seconds: 0.5
  - op_name: "按键-特殊攻击-按下"
  - op_name: "等待秒数"
    seconds: 0.5
  - op_name: "按键-特殊攻击-按下"
  - op_name: "等待秒数"
    seconds: 0.5
  - op_name: "按键-特殊攻击-按下"
  - op_name: "等待秒数"
    seconds: 0.5
  - op_name: "按键-特殊攻击-按下"
  - op_name: "等待秒数"
    seconds: 0.5
  - op_name: "按键-特殊攻击-按下"
  - op_name: "等待秒数"
    seconds: 0.4        # 累计 2.9s
  # ---- 松开 -> 自动衔接[敬请安息]风炮 ----
  - op_name: "按键-特殊攻击-松开"
  - op_name: "等待秒数"
    seconds: 1.5
