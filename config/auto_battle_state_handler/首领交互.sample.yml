description: "首领专属交互：终结技被禁用期间按空格，禁用解除立即中断"

# 用法：主脚本 scene 里用 triggers 触发「按键禁用-终结技」，handlers 里挂 state_template: "首领交互"
# 具体是哪个首领，在本文件 handlers 里按 states 分支，新增首领在下面继续加分支

handlers:
  # 薇斯珀有两套交互：开局约第 10 秒第一套，之后 3 分钟内再进是第二套
  # 第一套打完记状态，第二套只在该状态 0~180 秒内命中；时间先照抄第一套，待实测
  # 实测绝对时间 1 / 2.2 / 3.8 / 5.4，等待写间隔
  # 结构照抄基塔布鲁：外层只按首领分流，内层按禁用类型分支，切人再按第一套/第二套分流
  - states: "[首领-薇斯珀, 0, 999]"
    debug_name: "薇斯珀-首领交互"
    sub_handlers:
      - states: "[按键禁用-普通攻击, 0, 999] & [自定义-薇斯珀-第一套已打完, 0, 180]"
        interrupt_states: "![按键禁用-普通攻击, 0, 999]"
        debug_name: "薇斯珀-首领交互-切人-第二套"
        operations:
          - op_name: "等待秒数"
            seconds: 1.2
          - op_name: "按键-切换角色-下一个"
          - op_name: "等待秒数"
            seconds: 1.4 #2.7
          - op_name: "按键-切换角色-下一个"
          - op_name: "等待秒数"
            seconds: 1.8  #4.5
          - op_name: "按键-切换角色-下一个"
          - op_name: "等待秒数"
            seconds: 1.4  #5.9
          - op_name: "按键-切换角色-下一个"
          - op_name: "等待秒数"
            seconds: 2.3  #8.2
          - op_name: "按键-切换角色-下一个"
          - op_name: "等待秒数"
            seconds: 10
      - states: "[按键禁用-普通攻击, 0, 999] & ![自定义-薇斯珀-第一套已打完, 0, 180]"
        interrupt_states: "![按键禁用-普通攻击, 0, 999]"
        debug_name: "薇斯珀-首领交互-切人-第一套"
        operations:
          - op_name: "等待秒数"
            seconds: 0.6
          - op_name: "按键-切换角色-下一个"
          - op_name: "等待秒数"
            seconds: 1.4
          - op_name: "按键-切换角色-下一个"
          - op_name: "等待秒数"
            seconds: 1.6
          - op_name: "按键-切换角色-下一个"
          - op_name: "等待秒数"
            seconds: 1.8
          - op_name: "设置状态"
            state: "自定义-薇斯珀-第一套已打完"
          - op_name: "按键-切换角色-下一个"
          - op_name: "等待秒数"
            seconds: 10
      - states: "[按键禁用-终结技, 0, 999]"
        interrupt_states: "[按键禁用-普通攻击, 0, 999]"
        debug_name: "薇斯珀-首领交互-闪避"
        operations:
          - op_name: "等待秒数"
            seconds: 3.5
          - op_name: "按键-闪避"
          - op_name: "等待秒数"
            seconds: 0.2
          - op_name: "按键-闪避"
          - op_name: "等待秒数"
            seconds: 3

  # 基塔布鲁：终结技被禁用后 3.5 秒闪避一次；普攻被禁用后每 1.2 秒切换一次，切 3 次
  - states: "[首领-基塔布鲁, 0, 999]"
    debug_name: "基塔布鲁-首领交互"
    sub_handlers:
      - states: "[按键禁用-普通攻击, 0, 999]"
        interrupt_states: "![按键禁用-普通攻击, 0, 999]"
        debug_name: "基塔布鲁-首领交互-切人"
        operations:
          - op_name: "等待秒数"
            seconds: 0.8
          - op_name: "按键-切换角色-下一个"
          - op_name: "等待秒数"
            seconds: 1.2
          - op_name: "按键-切换角色-下一个"
          - op_name: "等待秒数"
            seconds: 1.4
          - op_name: "按键-切换角色-下一个"
          - op_name: "等待秒数"
            seconds: 10
      - states: "[按键禁用-终结技, 0, 999]"
        interrupt_states: "[按键禁用-普通攻击, 0, 999]"
        debug_name: "基塔布鲁-首领交互-闪避"
        operations:
          - op_name: "等待秒数"
            seconds: 3
          - op_name: "按键-闪避"
          - op_name: "等待秒数"
            seconds: 0.2
          - op_name: "按键-闪避"
          - op_name: "等待秒数"
            seconds: 3
