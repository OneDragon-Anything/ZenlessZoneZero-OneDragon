# 「锋御」职业的连携技处理（随仓库分发的默认配置）。
#
# 为什么需要它：连携模板-通用 的兜底分支依次尝试 命破 / 支援 / 异常 / 强攻 / 后置角色，
#   都不匹配就落到「连携模板-跳过」= 直接取消连携。锋御是新增职业，不在上面任何一个里，
#   所以不注册的话克拉蕾（以及以后任何锋御角色）会永远被跳过、不做连携。
#
# 克拉蕾的连携技会延长 [猩红铭刻] 2 秒，值得做，所以按和 连携模板-强攻 完全一样的写法处理：
#   连携技-1-锋御 → 按「连携-左」；连携技-2-锋御 → 按「连携-右」；两边都刷新 自定义-失衡时间。
# （连携-左/连携-右 模板内部已经会设置 自定义-连携换人，速切模板-克拉蕾 里读这个状态。）
template_name: "连携模板-锋御"
handlers:
  - states: "[连携技-1-锋御]"
    debug_name: "锋御连携-左"
    operations:
      - operation_template: "连携-左"
      - op_name: "设置状态"
        state: "自定义-失衡时间"
  - states: "[连携技-2-锋御]"
    debug_name: "锋御连携-右"
    operations:
      - operation_template: "连携-右"
      - op_name: "设置状态"
        state: "自定义-失衡时间"
