# 蕾米埃尔专属连携模板
#
# 连携技-1 是屏幕左边的候选 连携技-2 是右边 所以蕾米埃尔在左边就按右 在右边就按左
#
# 三种情况：
#   1. 蕾米埃尔和邦布一起出现 → 取消连携 两边都不选
#   2. 两边都是蕾米埃尔 → 取消连携
#   3. 蕾米埃尔和别的角色一起出现 → 选另外一边 绕开蕾米埃尔
#
# 邦布是「这个位子没认出角色」时的兜底推断 见 auto_battle_context 里连携识别那段
handlers:
  # 蕾米埃尔在左 右边是蕾米埃尔或邦布
  - states: "[连携技-1-蕾米埃尔] & ([连携技-2-蕾米埃尔] | [连携技-2-邦布])"
    sub_handlers:
      - state_template: "连携模板-跳过"

  # 蕾米埃尔在右 左边是邦布
  - states: "[连携技-2-蕾米埃尔] & [连携技-1-邦布]"
    sub_handlers:
      - state_template: "连携模板-跳过"

  # 蕾米埃尔在左 右边是别的角色 → 选右
  - states: "[连携技-1-蕾米埃尔]"
    debug_name: "蕾米埃尔连携-选右"
    operations:
      - operation_template: "连携-右"

  # 蕾米埃尔在右 左边是别的角色 → 选左
  - states: "[连携技-2-蕾米埃尔]"
    debug_name: "蕾米埃尔连携-选左"
    operations:
      - operation_template: "连携-左"
