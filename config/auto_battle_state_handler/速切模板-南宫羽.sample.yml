template_name: "速切模板-南宫羽"
handlers:
  - states: "[前台-南宫羽]"
    interrupt_states: "[前台-能量, 0, 0.1] & ![前台-南宫羽]"
    sub_handlers:
      # ========== 高优先级：系统强制行为 ==========
      - states: "[自定义-终结技被强制释放, 0, 1]"
        operations:
          - operation_template: "南宫羽-终结技"
          - op_name: "设置状态"
            state: "自定义-南宫羽-可爱地雷飞天撞"
            seconds: 2

      - states: "[自定义-黄光切人, 0, 1]"
        debug_name: "南宫羽-黄光支援"
        operations:
          - operation_template: "通用-支援攻击"
          - op_name: "设置状态"
            state: "自定义-黄光切人后摇"
            seconds: 0.5

      - states: "[自定义-红光闪避, 0, 1]"
        operations:
          - operation_template: "通用-闪A"

      - states: "[自定义-连携换人, 0, 0.5]"
        operations:
          - operation_template: "通用-连携攻击"
          - op_name: "设置状态"
            state: "自定义-南宫羽-可爱地雷飞天撞"
            seconds: 2

      # ========== 切人后等待（防呆）==========
      - states: "([按键-切换角色-下一个, 0, 0.3]|[按键-切换角色-上一个, 0, 0.3])"
        debug_name: "切人后等待"
        operations:
          - op_name: "等待秒数"
            seconds: 0.3

      # ========== 终结技：失衡期间不放 ==========
      - states: "[南宫羽-终结技可用] & ![自定义-失衡时间, 0, 15]"
        debug_name: "南宫羽-终结技"
        operations:
          - operation_template: "南宫羽-终结技"
          - op_name: "设置状态"
            state: "自定义-南宫羽-可爱地雷飞天撞"
            seconds: 2

      # ========== 可爱地雷飞天撞：重拍>=40 长按普攻，重拍<40 打断 ==========
      - states: "[自定义-南宫羽-可爱地雷飞天撞, -2, 0] & [南宫羽-重拍]{40, 100}"
        interrupt_states: "[南宫羽-重拍]{0, 39}"
        debug_name: "可爱地雷飞天撞-长按普攻"
        operations:
          - operation_template: "南宫羽-长按普攻"

      - states: "[自定义-南宫羽-可爱地雷飞天撞, -2, 0] & [南宫羽-重拍]{0, 39}"
        debug_name: "可爱地雷飞天撞-合轴"
        operations:
          - op_name: "清除状态"
            state: "自定义-南宫羽-可爱地雷飞天撞"
          - op_name: "设置状态"
            state: "自定义-合轴时间"
          - operation_template: "通用-切人普通攻击"

      # ========== 可爱地雷飞天撞之外不再有动作：合轴离场 ==========
      - states: ""
        debug_name: "南宫羽-合轴离场"
        operations:
          - op_name: "设置状态"
            state: "自定义-合轴时间"
          - operation_template: "通用-切人普通攻击"
