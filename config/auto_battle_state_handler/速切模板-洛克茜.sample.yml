template_name: "速切模板-洛克茜"
# 洛克茜 速切模板（随仓库分发的默认配置）
#
# 机制要点（决定下面怎么分支）：
#   * 洛克茜是**速切击破**，不站场。核心循环是「能量够 -> 切进来 -> 长按 E 刮龙卷风 ->
#     松手放风炮 -> 切走」，打完一套就走，把前场时间让给主 C。
#   * 长按 E 是**唯一的核心输出轴**（实测录屏确认）：[小心风寒] 伤害 2608%，
#     是终结技（2131%）的 1.2 倍、连携技（902%）的 2.9 倍、普攻 4 段（192%）的 13.6 倍。
#     而且只有它能聚怪 + 攒风能 —— 不按 E 就攒不出[风能] -> 风炮只打一段 ->
#     攒不到 3 个[风眼] -> [恕不远送]永不发动。整条链子挂在这一个键上。
#   * 时长是实测定的（2026-10-04 录屏）：**按住 E 2.9 秒积攒满 3 点[风能]**（约 1 秒 1 点）。
#     录屏里 t=2.3s 按下、t=5.2s 积攒满，两者相减才是长按时长。
#     能量校验：自旋每秒耗 30，2.9s 耗 87 点；攒 3 点需 75 点（25/点），实测每点约 29 点。
#     能量不足时游戏会提前断开[自旋]、攒不满 3 点 ⇒ 门槛取 {90, 120}。
#   * 一次攒满要 87 点，而能量上限是 120 ⇒ **一次长按基本掏空能量**，攒完之后
#     只剩 20~33 点，不够再攒一次。所以循环是「攒满一次 -> 切走 -> 攒能量 -> 再进来」，
#     而不是在前台连按。
#   * [风眼] 最多同时 9 个、持续 30 秒。场上 + 自身 ≥3 个时**游戏自己**发动
#     [恕不远送]丢锤引爆（引 3 个还送 1 阵巨型风旋 417%/秒）—— 这段不用脚本管，
#     脚本只负责「攒够风能 + 放出去」。
#   * 终结技[葬夜安魂曲]发动后**额外给 1 点风能**。所以失衡期先放终结技、再长按，
#     等于用 1 点能量换 1 点风能。
#
# 写法约定：
#   `[名]`       = 「1 秒内触发过」（框架默认时间窗就是 [0, 1]）
#   `[名, a, b]` = 「距上次触发 a~b 秒」
#   `[名]{a, b}` = 「最近一次记录的**数值**落在 a~b」
# 角色状态每 0.5 秒才识别一次，所以这里统一放宽到 [.., 0, 2]，避免漏一拍就断档。
handlers:
  - states: "[前台-洛克茜]"
    interrupt_states: "[前台-能量, 0, 0.1] & ![前台-洛克茜]"
    sub_handlers:
      # ---- 黄光：支援突击「午夜守则」，命中风化中的敌人还能触发净化给全队增益 ----
      #
      # 判定用 `[闪避识别-黄光]` 而不是 `[自定义-黄光切人]`（2026-10-04 实机修正）：
      # `自定义-黄光切人` 只由 `双反模板-*` 设置，而洛克茜的黄光切人改走了
      # `支援攻击模板-特殊情况` 里的直接切人（那里排第一、命中就短路双反），
      # 所以这个信号**永远不会再为洛克茜出现**。
      # `闪避识别-黄光` 才是黄光的原始来源：闪避识别场景设它，
      # 速切模板通过 `全配队通用` 的「连携-支援」分支命中本模板
      # （那条分支的判定就是 `[闪避识别-黄光, 0, 0.5]`）。
      #
      # `![自定义-动作不打断]` 守卫不能省：主循环是最低优先级触发器，
      # **同一触发器内重复命中不会自我打断**（`operator.py` 里
      # `running_executor_cnt > 0` 时直接跳过匹配）。没有守卫的话支援动作跑完、
      # 黄光仍在窗口内时会立刻再打一轮，把后摇接成普通连段
      # （实测日志里隔 0.39~0.51 秒就重跑了一次）。
      - states: "[闪避识别-黄光, 0, 0.5] & ![自定义-动作不打断]"
        debug_name: "支援攻击-午夜守则"
        operations:
          - operation_template: "洛克茜-支援攻击"

      # ---- 红光 / 声音：闪避之后接普攻三段，把闪避反击「礼尚往来」打满 ----
      - states: "[自定义-红光闪避, 0, 1]"
        debug_name: "闪避反击-礼尚往来"
        operations:
          - operation_template: "洛克茜-闪避反击"

      # ---- 连携技 ----
      - states: "[自定义-连携换人, 0, 0.5]"
        debug_name: "连携攻击-葬风巨锤"
        operations:
          - operation_template: "洛克茜-连携攻击"

      # ---- 自动战斗开了「终结技自动释放」时会被要求强制放 ----
      - states: "[自定义-终结技被强制释放, 0, 1]"
        debug_name: "强制释放终结技"
        operations:
          - operation_template: "洛克茜-终结技"

      # ---- 失衡期：终结技 +1 风能，再长按，是她收益最高的窗口 ----
      # 敌人动不了时风眼不会被躲开，风炮多段全吃满。
      - states: "[自定义-失衡时间, 0, 8] & [洛克茜-终结技可用]"
        debug_name: "失衡期-终结技(+1风能)"
        operations:
          - operation_template: "洛克茜-终结技"

      # ---- 能量够攒满 3 点（需 ≥87，门槛 90 留余量）：长按到底 ----
      # 这里不加冷却：能量门槛本身就是限流 —— 长按一次耗 87，攒满后能量必然掉出
      # {90, 120}，下一轮自然走到下面的「申请切走」分支。之前用「固定 7 秒冷却」
      # 结果是攒满后被冷却挡在门外、又落进「攒 1 点」分支连按短 E，能量白白溢出。
      - states: "[洛克茜-能量]{90, 120}"
        debug_name: "长按E-攒满3点风能"
        operations:
          - operation_template: "洛克茜-强化特殊技-攒满"

      # ---- 能量不够攒满：申请切走，同时普攻攒能量 ----
      # 不再短按攒 1 点：短按收益只有长按的 1/3（风炮少打 2 段、攒不出[风眼]
      # 触发[恕不远送]），却要占住前台 4.5 秒，能量还溢出。攒 3 点需 87 能量，
      # 既然不够跑一轮龙卷风，不如把前场让给主 C。
      #
      # 顺序：先设合轴信号，再普攻。operations 是串行的，设完状态才执行普攻；
      # 等普攻这 8.5 秒跑完，下一轮决策时合轴 scene（priority 80）会先于主循环
      # 被检查，此时切人已经生效。
      - states: "[洛克茜-能量]{0, 89}"
        debug_name: "能量不足-申请切走并攒能量"
        operations:
          - op_name: "设置状态"
            state: "自定义-合轴时间"
            seconds: 1
          - operation_template: "洛克茜-普攻连段"

  # ================= 后台：能量满了主动申请进场 =================
  #
  # 为什么需要这一支：合轴 scene 的**唯一触发器**是 `自定义-合轴时间`，而这个信号
  # 由「当前在前的角色」的速切模板设。站场型角色（如克拉蕾的猩红铭刻循环）故意不设它，
  # 因为她们要连着站场 16 秒。所以洛克茜在后台时如果只等合轴，等到的是克拉蕾整套铭刻
  # 打完才有机会 —— 期间能量满着溢出，白白浪费。
  #
  # 这一支让洛克茜在**后台**就举手：「我能量够了，切我进来」。
  # 真正的切人动作由 `轮换-合轴-全角色` 里的「洛克茜能量够-切入」分支执行，
  # 这里只负责把合轴信号打起来（与其它角色等价的做法，只是提早起手）。
  # 门槛必须与上面的「长按E-攒满3点风能」一致（90）。若这里放宽到 75，
  # 能量落在 75~89 时会切进来、又立刻命中「能量不足-申请切走」，白切一趟。
  - states: "[后台-洛克茜] & [洛克茜-能量]{90, 120}"
    debug_name: "后台能量够-申请合轴切入"
    interrupt_states: "![后台-洛克茜]"
    operations:
      - op_name: "设置状态"
        state: "自定义-合轴时间"
        seconds: 1
