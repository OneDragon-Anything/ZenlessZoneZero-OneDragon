template_name: "洛克茜-合轴决策"
# 洛克茜的合轴（切人进场）决策，逻辑全部收在这里，公共模板只留一行引用。
#
# 为什么单独拆文件：这个模板是公共的、按角色分派的，里面已经有妮可、琉音、
# 奥菲丝等角色的内联分支。新增角色时把逻辑写进自己的文件、公共模板只加
# `- state_template: "洛克茜-合轴决策"`，review 时只看自己那个文件，
# 别人不会因为我又改了一大片而需要重新读整个公共模板。
#
# 门槛为什么用 {90, 120}：
#   攒满 3 点[风能]实测耗 87 能量（按住 E 2.9 秒 × 每秒 30），门槛 90 留余量。
#   **必须与速切模板里的放招门槛一致** —— 若这里放宽、切进来后立刻命中
#   速切模板的「能量不足」分支，就会白切一趟。
#   不用 `[洛克茜-特殊技可用]`：那个信号 25 能量就亮，会在只够攒 1 点
#   风能时就切进来，浪费一次进场。
handlers:
  - states: "![前台-洛克茜]"
    sub_handlers:
      - states: "[洛克茜-能量]{90, 120}"
        debug_name: "洛克茜能量够-切入"
        operations:
          - op_name: "按键-切换角色"
            agent_name: "洛克茜"
          - op_name: "清除状态"
            state_list: ["自定义-合轴时间", "自定义-动作不打断"]
