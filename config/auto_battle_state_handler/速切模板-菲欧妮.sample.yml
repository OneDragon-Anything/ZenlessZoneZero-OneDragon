template_name: "速切模板-菲欧妮"
# 菲欧妮 速切模板（火属性异常，前台异常 C）
#
# 机制要点（决定下面怎么分支）：
#   * 燃烧攻击攒「燔焰」，满 90 点长按普攻发动「普攻:焚罪」，
#     命中处于属性异常状态的敌人结算「异放」伤害——这是她唯一的爆发出口。
#   * 所以主循环只有两件事：没满 90 就攒（强化特殊技优先，其余普攻），
#     满了就长按普攻放焚罪；焚罪把燔焰打到 30 以下之后合轴切走。
#   * 黄光走招架支援（支援攻击模板）；红光直接用特殊技格挡，普通特殊技也带格挡，不用等能量。
#
# 判定说明：
#   燔焰满值 120 点，`max_length` 取 120，所以识别值就是燔焰点数；满 90 点即可放焚罪，
#   所以释放窗口写 `{90, 120}`。条是像素量出来的，不要把窗口卡死在单点。
#   焚罪之后的「可以合轴」用标记位实现：进长按之前先设 `自定义-菲欧妮-焚罪`，
#   长按结束（燔焰掉到 30 以下被打断）后由这个标记触发合轴，不再判燔焰数值。
handlers:
  - states: "[前台-菲欧妮]"
    interrupt_states: "[前台-能量, 0, 0.1] & ![前台-菲欧妮]"
    sub_handlers:
      # ---- 大招优先级最高 ----
      - states: "[自定义-终结技被强制释放, 0, 1]"
        debug_name: "强制释放终结技"
        operations:
          - operation_template: "通用-终结技"

      # ---- 黄光：招架支援（照仪玄的写法，走支援攻击模板） ----
      - states: "[自定义-黄光切人, 0, 1]"
        debug_name: "黄光-支援攻击"
        operations:
          - operation_template: "通用-支援攻击"

      # ---- 红光：普通特殊技就能格挡，不用等能量 ----
      - states: "[自定义-红光闪避, 0, 1]"
        debug_name: "红光-特殊技格挡"
        operations:
          - operation_template: "菲欧妮-特殊技"

      - states: "[自定义-连携换人, 0, 0.5]"
        debug_name: "连携攻击"
        operations:
          - operation_template: "通用-连携攻击"

      - states: "([按键-切换角色-下一个, 0, 0.3]|[按键-切换角色-上一个, 0, 0.3])"
        debug_name: "切人后等待"
        sub_handlers:
          - states: "[自定义-快速支援换人, 0, 0.5]"
            operations:
              - operation_template: "通用-快速支援"
          - states: ""
            operations:
              - op_name: "等待秒数"
                seconds: 0.3

      - states: "[菲欧妮-终结技可用]"
        debug_name: "终结技"
        operations:
          - operation_template: "通用-终结技"

      # ---- 燔焰到 90 以上：打标记 -> 长按普攻，焚罪结算异放 ----
      # 标记在动作开始前就设，长按期间条会往下掉，掉到 30 以下就打断，避免长按空转。
      - states: "[菲欧妮-燔焰]{90, 120}"
        interrupt_states: "[菲欧妮-燔焰]{0, 30}"
        debug_name: "燔焰90以上-长按普攻焚罪"
        operations:
          - op_name: "设置状态"
            state: "自定义-菲欧妮-焚罪"
          - operation_template: "菲欧妮-长按普攻-焚罪"

      # ---- 焚罪打完：这一轮结束，合轴切走 ----
      # 条件只看标记。标记是进长按那一刻打的，长按本身 3.5 秒，所以判定窗口要显式
      # 放宽到 [0, 6]；不写时间段默认只有 [0, 1]，长按还没按完就已经过期。
      - states: "[自定义-菲欧妮-焚罪, 0, 6]"
        debug_name: "焚罪结算完毕-合轴"
        operations:
          - op_name: "清除状态"
            state: "自定义-菲欧妮-焚罪"
          - op_name: "设置状态"
            state: "自定义-合轴时间"

      # ---- 有强化特殊技、或者身上有升变，都可以打特殊技 ----
      # 打完接 A3A4，A4 由模板自己设合轴时间，所以这一支也是合轴入口。
      - states: "[菲欧妮-特殊技可用] | [菲欧妮-升变]{1, 99}"
        debug_name: "强化特殊技或升变-特殊技"
        operations:
          - operation_template: "菲欧妮-特殊技"

      # ---- 其余时间无脑普攻 ----
      - states: ""
        debug_name: "普攻攒燔焰"
        operations:
          - operation_template: "通用-普通攻击"
