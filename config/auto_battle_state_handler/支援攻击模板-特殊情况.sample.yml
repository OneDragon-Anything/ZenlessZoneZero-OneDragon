# 需要特别处理的模板
#
# 这个模板在两处被引用，且都在 handlers 列表里**排第一**，命中就会短路后面的
# `双反模板-*`（自动战斗）或 `支援攻击模板-*`（智能格挡）：
#   config/auto_battle/全配队通用.sample.yml  ← 自动战斗走这条
#   config/dodge/智能格挡.sample.yml
# 所以「需要切进去打支援动作」的角色写在这里 —— 用直接切人，绕开双反模板的
# 「闪避 → 普攻 → 切人」序列（那套序列的切人在最后，会错过支援动作的突进
# 窗口，详见「洛克茜-黄光支援切入」里的说明）。
#
# 本文件里大部分角色仍是内联条件（薇薇安、浮波柚叶、青衣、凯撒、本、仪玄…）。
# 新增角色若条件较多，可以像洛克茜那样拆成独立文件、本处只留一行
# `state_template` 引用；条件简单就直接写在这里，不必拆。
handlers:
  - states: "![前台-薇薇安] & [薇薇安-能量]{0, 120}"
    operations:
      - op_name: "按键-切换角色"
        agent_name: "薇薇安"

  - states: "![前台-浮波柚叶] & [浮波柚叶-能量]{0, 120}"
    operations:
      - op_name: "按键-切换角色"
        agent_name: "浮波柚叶"

  - state_template: "洛克茜-黄光支援切入"

  # 青衣特殊技不可用的情况下没必要切人，直接闪A
  - states: "![自定义-血量扣减, 0, 8]"
    sub_handlers:
      - states: "[前台-青衣]"
        operations:
          - op_name: "设置状态"
            state: "自定义-红光闪避"
      - states: "[前台-零号安比]"
        sub_handlers:
          - state_template: "双反模板-下一个"

  - states: "[前台-异常] & ![自定义-动作不打断, -10, -0.1]"
    sub_handlers:
      - states: "([按键-切换角色-下一个, 0, 3]|[按键-切换角色-上一个, 0, 3])" # 异常角色至少输出3秒
        operations:
          - op_name: "设置状态"
            state: "自定义-红光闪避"

  - states: "[前台-凯撒]"
    operations:
      - op_name: "设置状态"
        state: "自定义-凯撒-护盾"
      - operation_template: "凯撒-特殊技格挡"
      - op_name: "设置状态"
        state: "自定义-合轴时间" # 强者不需要切人直接格挡就行

  - states: "[前台-本]"
    operations:
      - op_name: "设置状态"
        state: "自定义-本-守卫"
      - op_name: "按键-特殊攻击"
        post_delay: 0.1
        repeat: 5
      - op_name: "设置状态"
        state: "自定义-合轴时间"

  - states: "[前台-仪玄] & [仪玄-术法值]{0, 119} & [仪玄-特殊技可用] & ![自定义-动作不打断, -9, 0]"
    debug_name: "仪玄情不自禁格挡"
    operations:
      - op_name: "设置状态"
        state: "自定义-红光闪避"

  - states: "[前台-普罗米娅] & [普罗米娅-特殊技可用] & ![自定义-动作不打断, -9, 0]"
    debug_name: "普罗米娅黄光转特殊技"
    operations:
      - op_name: "设置状态"
        state: "自定义-红光闪避"

  - states: "[前台-叶瞬光] & [叶瞬光-明心境]{0,0} & ![自定义-动作不打断, -2, 0]"
    debug_name: "叶瞬光打能量"
    operations:
      - op_name: "设置状态"
        state: "自定义-红光闪避"

  - states: "[前台-佩洛伊斯] & [佩洛伊斯-特殊技可用] & ![自定义-动作不打断, -9, 0]"
    debug_name: "佩洛伊斯黄光转特殊技"
    operations:
      - op_name: "设置状态"
        state: "自定义-红光闪避"