# 克拉蕾·弗林特 速切模板（随仓库分发的默认配置）
#
# 机制要点（决定下面怎么分支）：
#   * 锐能 = 克拉蕾自己的能量，满 60 点按强化特殊技 → 进入[猩红铭刻]（血斧形态）16 秒。
#     游戏里「锐能」就是常规能量条，直接用 [克拉蕾-特殊技可用] / [克拉蕾-能量] 判断，不需要专属条。
#   * [克拉蕾-猩红铭刻] 是**真实识别出来的**状态（agent_state 模板，见 agent.py 的 CLARET）。
#     头像下方那条红色蝙蝠翼横幅＝剩余时长：满≈刚变身，空＝状态结束。
#     所以不需要再自己记 16 秒倒计时；终结技不消耗时长、连携技 +2 秒，条都会自己反映。
#   * 残痕叠在敌人身上（最多 3 层），读不到层数 → 靠「点按爆 1 层 / 长按全爆」的动作本身兜底。
#   * 反制支援「寸铁不让」：敌人出控制技（黄光）时角力，成功后白嫖 1 层残痕。
#
# 写法约定：
#   `[名]`       = 「1 秒内触发过」（框架默认时间窗就是 [0, 1]）
#   `[名, a, b]` = 「距上次触发 a~b 秒」
#   `[名]{a, b}` = 「最近一次记录的**数值**落在 a~b」
# 角色状态每 0.5 秒才识别一次，所以这里统一放宽到 [.., 0, 2]，避免漏一拍就断档。
template_name: "速切模板-克拉蕾"
handlers:
  - states: "[前台-克拉蕾]"
    interrupt_states: "[前台-能量, 0, 0.1] & ![前台-克拉蕾]"
    sub_handlers:
      # ---- 黄光：反制支援「寸铁不让」，长按普攻角力，成功白嫖 1 层残痕 ----
      - states: "[自定义-黄光切人, 0, 1]"
        debug_name: "反制支援-寸铁不让"
        operations:
          - operation_template: "克拉蕾-支援攻击"

      # ---- 红光 / 声音：闪避之后接普攻三段 ----
      - states: "[自定义-红光闪避, 0, 1]"
        debug_name: "闪避反击"
        operations:
          - operation_template: "克拉蕾-闪避反击"

      # ---- 连携技 ----
      # 铭刻的 +2 秒由状态条自己反映，这里不用再 seconds_add
      - states: "[自定义-连携换人, 0, 0.5]"
        debug_name: "连携攻击"
        operations:
          - operation_template: "克拉蕾-连携攻击"

      # ---- 自动战斗开了「终结技自动释放」时会被要求强制放 ----
      - states: "[自定义-终结技被强制释放, 0, 1]"
        debug_name: "强制释放终结技"
        operations:
          - operation_template: "克拉蕾-终结技"

      # ---- 猩红铭刻期间（条上还有红） ----
      - states: "[克拉蕾-猩红铭刻, 0, 2]"
        debug_name: "猩红铭刻期间"
        sub_handlers:
          # 失衡窗口 + 终结技就绪：伤害最高，且动画不消耗铭刻时长
          - states: "[自定义-失衡时间, 0, 8] & [克拉蕾-终结技可用]"
            debug_name: "失衡期终结技"
            operations:
              - operation_template: "克拉蕾-终结技"

          # 失衡窗口：长按强化特殊技一次引爆全部残痕（限流 8 秒，避免反复长按）
          - states: "[自定义-失衡时间, 0, 8] & ![自定义-克拉蕾-终爆冷却, 0, 8]"
            debug_name: "失衡期长按E引爆全部残痕"
            operations:
              - operation_template: "克拉蕾-终爆"

          # 铭刻见底（条 ≤30%，约最后 5 秒）：把残痕一次爆掉收尾，别再起长循环
          - states: "[克拉蕾-猩红铭刻, 0, 2]{5, 30} & [克拉蕾-终结技可用]"
            debug_name: "铭刻收尾-终结技"
            operations:
              - operation_template: "克拉蕾-终结技"

          - states: "[克拉蕾-猩红铭刻, 0, 2]{5, 30} & ![自定义-克拉蕾-终爆冷却, 0, 8]"
            debug_name: "铭刻收尾-引爆残痕"
            operations:
              - operation_template: "克拉蕾-终爆"

          # ---- 蓄痕兜底：残痕层数在敌人身上，自动战斗读不到 ----
          # 残痕最多 3 层，满 3 层之后继续攻击是白攒（不再叠层）。
          # 所以用「自定义-克拉蕾-终爆冷却」当计时器：距上次长按E全爆满 7 秒，
          # 就把攒着的残痕一次爆掉，避免长期卡在 3 层不消耗。
          # 计时器由「克拉蕾-进入猩红铭刻」在变身时打点 + 「克拉蕾-终爆」自己打点，
          # 所以不会在铭刻刚开始（层数还没攒起来）就立刻爆。
          # 后半截 `& [.., 0, 9999]` 是「这个计时器存在」：状态从没被设置过时
          # last_record_time = -1，与当前时间的差值会是个天文数字，两个条件都不成立，
          # 于是不会在「开局就已处于铭刻」这种边缘情况下空爆一次。
          - states: "[克拉蕾-猩红铭刻, 0, 2] & ![自定义-克拉蕾-终爆冷却, 0, 7] & [自定义-克拉蕾-终爆冷却, 0, 9999]"
            debug_name: "蓄痕兜底-长按E全爆"
            operations:
              - operation_template: "克拉蕾-终爆"

          # 其余时间：点按 E 引爆 1 层 + 长按普攻三段的站场循环
          - states: ""
            debug_name: "E + 长按普攻 循环"
            operations:
              - operation_template: "克拉蕾-强化连段"

      # ---- 没在铭刻、锐能已满：点按 E 变身（变身冷却防手抖连按）----
      - states: "![克拉蕾-猩红铭刻, 0, 2] & [克拉蕾-特殊技可用] & ![自定义-克拉蕾-变身冷却, 0, 2]"
        debug_name: "锐能已满，进入猩红铭刻"
        operations:
          - operation_template: "克拉蕾-进入猩红铭刻"

      # ---- 兜底：普攻打伤害顺便攒锐能 ----
      - states: ""
        debug_name: "普攻攒锐能"
        operations:
          - operation_template: "克拉蕾-普攻连段"
