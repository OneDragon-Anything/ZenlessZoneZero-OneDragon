# 克拉蕾·弗林特 速切模板（随仓库分发的默认配置）
#
# ── 机制要点（按官方技能说明核对）──────────────────────────────────────────
#   * 锐能 = 锋御职业的专属能量条（上限 120、自然回复 1.5/秒、入场 +60）。
#     E 按钮亮 = 锐能够 60 且当前不在铭刻 ⇒ 直接用 [克拉蕾-特殊技可用] 判断，
#     不需要读锐能数值（[克拉蕾-能量] 只留着调试用）。
#   * 强化特殊技本身就是一次攻击（把锻造锤变成血斧斩击），进 [猩红铭刻]
#     是它的附带结果 ⇒ 铭刻里重复按 E 只会换成「斩金断铁」，照样出伤害、
#     照样爆残痕，没有任何副作用需要挡，所以全流程不需要给 E 设冷却。
#   * [克拉蕾-猩红铭刻] 由 agent_state 模板识别（头像下方那条红色蝙蝠翼横幅＝剩余时长）。
#     铭刻内点按 / 长按 E 都**不消耗锐能** ⇒ 铭刻里 E 不需要限流，该按就按。
#   * 残痕叠在敌人身上（最多 3 层），自动战斗读不到层数；但按法本身就能兜底：
#       点按 E = 斩金断铁 → 固定消耗 1 层、1 次毁伤；
#       长按 E = 葬血强袭 → 连续 3 次横斩，有几层爆几层（1~3 层 → 最多 3 次毁伤）。
#     ⇒ 长按是点按的超集 ⇒ 铭刻内只保留一个 E 动作（见「克拉蕾-铭刻循环」）。
#   * 反制支援「寸铁不让」：敌人出控制技（黄光）时角力，成功后白嫖 1 层残痕。
#
# ── 为什么这样编排有效 ────────────────────────────────────────────────────
#   * 锐能只在一处花掉：不在铭刻 + E 亮 ⇒ 立刻进铭刻（扣 60）。这条守卫里没有任何
#     冷却，所以条件一成立的下一拍就会按下去，锐能不会滞留在满值上。
#   * 铭刻里只跑「长按 E 全爆 + 普攻垫残痕」一个循环：每一轮长按 E 都把残痕清空，
#     既不会卡在 3 层上限，也不需要任何计时器去猜层数。
#   * 铭刻里 Q 就绪就放：官方明确「终结技发动期间铭刻持续时长不再减少」，
#     等于用一段不占铭刻时间的长动画白嫖伤害窗口（Q 吃喧响值，不吃锐能）。
#
# ── 分支顺序（同一层从上到下，先匹配先执行）──────────────────────────────
#   黄光支援 > 红光闪避 > 连携技 > 强制终结技 > 铭刻期 > 进铭刻 > 普攻兜底
#   前 4 条是反应型动作，必须压在主循环上面。
#
# 写法约定：
#   `[名]`       = 「1 秒内触发过」（框架默认时间窗就是 [0, 1]）
#   `[名, a, b]` = 「距上次触发 a~b 秒」（a 为负 = 状态生效中）
#   `[名]{a, b}` = 「最近一次记录的**数值**落在 a~b」（如铭刻剩余百分比）
template_name: "速切模板-克拉蕾"
handlers:
  - states: "[前台-克拉蕾]"
    interrupt_states: "[前台-能量, 0, 0.1] & ![前台-克拉蕾]"
    sub_handlers:
      # ---- 黄光：反制支援「寸铁不让」，点按 E 角力，成功白嫖 1 层残痕 ----
      - states: "[自定义-黄光切人, 0, 1]"
        debug_name: "反制支援-寸铁不让"
        operations:
          - operation_template: "克拉蕾-支援攻击"

      # ---- 红光 / 声音：闪避之后接普攻三段 ----
      - states: "[自定义-红光闪避, 0, 1]"
        debug_name: "闪避反击"
        operations:
          - operation_template: "克拉蕾-闪避反击"

      # ---- 连携技 ----
      # 铭刻的 +2 秒由状态条自己反映，这里不用再 seconds_add
      - states: "[自定义-连携换人, 0, 0.5]"
        debug_name: "连携攻击"
        operations:
          - operation_template: "克拉蕾-连携攻击"

      # ---- 自动战斗开了「终结技自动释放」时会被要求强制放 ----
      # （GUI 里那个开关默认是关的，开了才走这条）
      - states: "[自定义-终结技被强制释放, 0, 1]"
        debug_name: "强制释放终结技"
        operations:
          - operation_template: "克拉蕾-终结技"

      # ---- 猩红铭刻期间：2 条分支 ----
      - states: "[克拉蕾-猩红铭刻, 0, 2]"
        debug_name: "猩红铭刻期间"
        sub_handlers:
          # 铭刻里 Q 就绪就放：官方明确「终结技发动期间铭刻持续时长不再减少」，
          # 等于白嫖一个长动画的伤害窗口（Q 吃喧响值，不吃锐能）。
          - states: "[克拉蕾-终结技可用]"
            debug_name: "铭刻期终结技"
            operations:
              - operation_template: "克拉蕾-终结技"

          # 其余全部时间跑同一个循环：长按 E 全爆 + 普攻垫残痕。
          # 长按 E 每个循环都会把残痕清空，所以既不用读层数、也不用任何计时器。
          - states: ""
            debug_name: "长按E全爆 + 普攻三段"
            operations:
              - operation_template: "克拉蕾-铭刻循环"

      # ---- 没在铭刻、E 按钮亮（锐能 ≥ 60）：立刻按 E 进铭刻 ----
      # 这是整条策略里**唯一**消耗锐能的一步（60 点）；进去之后点按/长按 E 都不消耗锐能。
      # 守卫只看「E 亮 + 不在铭刻」，没有任何冷却 ⇒ 条件成立的下一拍就按。
      - states: "![克拉蕾-猩红铭刻, 0, 2] & [克拉蕾-特殊技可用]"
        debug_name: "锐能已满，进入猩红铭刻"
        operations:
          - operation_template: "克拉蕾-进入猩红铭刻"

      # ---- 兜底：还没攒够 60 锐能，普攻打伤害 + 顺便给敌人垫残痕值 ----
      - states: ""
        debug_name: "普攻攒锐能"
        operations:
          - operation_template: "克拉蕾-普攻连段"
