template_name: "洛克茜-黄光支援切入"
# 洛克茜的黄光支援切入决策，逻辑收在这里，公共模板只留一行引用。
#
# 为什么要在黄光时直接切她进来：
#   洛克茜的[支援突击:午夜守则]倍率 1112%，是黄光时能拿到的最高收益。
#   但黄光默认走的「双反模板-击破」按键序列是
#     按键-闪避 → 按键-普通攻击 → 按键-切换角色-下一个
#   那套动作是给**防御向职业**设计的（用切人前这段时间打闪A/格挡收益），
#   切人在最后。而切人是瞬时点按，角色切过去时已经过了 0.1~0.2 秒，
#   支援突击的突进窗口比这更短 —— 等她自己的速切模板拿到前台开始按普攻，
#   支援动作已经结束了。表现是「切进来了，但支援技没打出来」。
#   所以这里用直接切人，抢在双反模板之前命中（见「支援攻击模板-特殊情况」）。
#
# 门槛为什么用 {90, 120}：
#   与「洛克茜-合轴决策」「速切模板-洛克茜」的放招门槛**必须三者一致**。
#   她能量不够 90 时进来既打不出支援突击、也放不出强化特殊技，白切一趟。
#
# 注意这里**不设** `自定义-黄光切人` —— 那个信号是给双反模板去切人用的，
# 这里已经切完了。洛克茜自己的速切模板靠 `[闪避识别-黄光, 0, 0.5]` 命中
# （由「全配队通用」的「连携-支援」分支分发）。
handlers:
  - states: "![前台-洛克茜] & [洛克茜-能量]{90, 120}"
    operations:
      - op_name: "按键-切换角色"
        agent_name: "洛克茜"
