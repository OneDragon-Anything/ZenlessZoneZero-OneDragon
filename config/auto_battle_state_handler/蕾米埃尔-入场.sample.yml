template_name: "蕾米埃尔-入场"
# 蕾米埃尔的入场决策，紧急与合轴共用同一套。
# 入场技的切人按键与失衡时间补偿都收在「蕾米埃尔-入场技」操作模板里，这里只决定什么时候进场。
handlers:
  # 虚曜3点配合浮晖10~75，放整套入场技
  - states: "[蕾米埃尔-虚曜]{3,3} & [蕾米埃尔-浮晖]{10,75} & ![前台-蕾米埃尔]"
    debug_name: "蕾米埃尔虚曜入场技切入"
    operations:
      - operation_template: "蕾米埃尔-入场技"

  # 浮晖满点，切入后由速切模板接管长按强化特殊技
  - states: "[蕾米埃尔-浮晖]{100,100} & ![前台-蕾米埃尔]"
    debug_name: "蕾米埃尔浮晖满点切入"
    operations:
      - op_name: "按键-切换角色"
        agent_name: "蕾米埃尔"
      - op_name: "设置状态"
        state_list: ["自定义-动作不打断", "自定义-无视闪光"]
        seconds: 1

  # 虚曜满点切入，后续由速切模板先长按普攻再长按强化特殊技
  - states: "[蕾米埃尔-虚曜]{3,3} & ![前台-蕾米埃尔]"
    debug_name: "蕾米埃尔虚曜满点切入"
    operations:
      - op_name: "按键-切换角色"
        agent_name: "蕾米埃尔"
