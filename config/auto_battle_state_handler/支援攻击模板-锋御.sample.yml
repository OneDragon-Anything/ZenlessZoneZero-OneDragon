# 黄光时 锋御(克拉蕾)的反制支援「寸铁不让」是强力黄光角力反击，优先切锋御角力
# 负责闪A切人A 普攻后摇等待时间各角色不同 由后续动作控制
handlers:
  - states: "[后台-2-锋御]"
    operations:
      - op_name: "按键-切换角色-上一个"
      - op_name: "设置状态"
        state: "自定义-黄光切人"
  - states: "[后台-1-锋御]"
    operations:
      - op_name: "按键-切换角色-下一个"
      - op_name: "设置状态"
        state: "自定义-黄光切人"
