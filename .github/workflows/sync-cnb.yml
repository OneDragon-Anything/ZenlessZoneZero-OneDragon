name: Sync to CNB

on:
  push:
  # 发版时 tag 由 Release 步骤创建，不产生 push 事件；用 release 事件补齐镜像。
  release:
    types: [published]
  workflow_dispatch:
  # build-test-branch 用 GITHUB_TOKEN 推 test 分支，这种 push 不会触发本工作流；
  # 用 workflow_run 在测试分支重建完成后再补一次同步。
  workflow_run:
    workflows: ["Build Test Branch"]
    types: [completed]

permissions:
  contents: read

jobs:
  sync:
    if: ${{ github.repository == 'OneDragon-Anything/ZenlessZoneZero-OneDragon' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Push to CNB
        env:
          CNB_TOKEN: ${{ secrets.CNB_GIT_TOKEN }}
        run: |
          git clone --bare "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" repository.git
          git -C repository.git remote add cnb "https://cnb:${CNB_TOKEN}@cnb.cool/OneDragon-Anything/ZenlessZoneZero-OneDragon.git"
          git -C repository.git push --force --prune cnb \
            '+refs/heads/*:refs/heads/*' \
            '+refs/tags/*:refs/tags/*'
