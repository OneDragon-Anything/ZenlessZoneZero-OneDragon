# 从最新 main 重建两个测试分支，并逐个加入待测 PR 的 squash 提交：
#   1. test：源码启动器使用，包含全部待测 PR。
#   2. test-integrated：集成启动器使用，排除修改 deploy/module_manifest.py 的 PR。
#
# PR 来源(二选一):
#   1. 定时 / 不填参数:所有带 `test-branch` 标签的 open PR,按 PR 号升序。
#   2. 手动触发填 prs:按填写顺序,临时覆盖标签(不改动标签本身)。
# 仅处理目标分支为 main 的 PR，其他 PR 会跳过并写入构建摘要。
#
# 定时构建会按 module_manifest 变动同步 `test-integrated-branch` 标签；
# 两个分支分别使用 `test-conflict` 和 `test-integrated-conflict` 标记冲突。
# 每次都从 origin/main 重新开始，所以测试分支上不会残留历史垃圾。
name: Build Test Branch

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      prs:
        description: '临时 PR 列表(如 2571,2567,2527),按填写顺序合入;留空则用 test-branch 标签'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  INCLUDE_LABEL: test-branch
  CONFLICT_LABEL: test-conflict
  INTEGRATED_LABEL: test-integrated-branch
  INTEGRATED_CONFLICT_LABEL: test-integrated-conflict

jobs:
  build-test-branch:
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'OneDragon-Anything' }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Test Branch
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        INPUT_PRS: ${{ inputs.prs }}
      run: python3 tools/ci/build_test_branch.py
