# 空洞类玩法的局内常驻界面（HUD）。
# 登录后可能直接落在这种画面（例如在贝果计划局内退出游戏再登录），
# 登录流程需要识别它并退出玩法，避免把「已在游戏内」误判成未知画面并一直等待。
# 各区域的判定方式见 hollow_zero_inside_screen.py；本文件只记录坐标。
